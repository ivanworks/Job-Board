<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Job Board</title><style id="css">
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e4e4df;--ac:#2f6fed;--ac-tx:#fff;--dn:#c0392b;--s0:#2f6fed;--s1:#d98a00;--s2:#8a4fd6;--s3:#1f9d55;--s4:#8a8a85;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222221;--tx:#efefec;--mut:#9a9a94;--bd:#33332f;--ac:#6c9bff;--ac-tx:#111;--dn:#ff7b6b;--s0:#6c9bff;--s1:#f0b040;--s2:#b58cf0;--s3:#4cc47f;--s4:#a0a09a}}
:root[data-theme="dark"]{--bg:#171716;--card:#222221;--tx:#efefec;--mut:#9a9a94;--bd:#33332f;--ac:#6c9bff;--ac-tx:#111;--dn:#ff7b6b;--s0:#6c9bff;--s1:#f0b040;--s2:#b58cf0;--s3:#4cc47f;--s4:#a0a09a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 4px;font-size:28px}
.sub{color:var(--mut);margin:0 0 16px}
.bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;min-width:0}
.bar input{flex:1 1 200px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px}
button.pri{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
button.del{color:var(--dn)}
.card{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:18px}
.meta{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin-left:6px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.row a.apply{background:var(--ac);color:var(--ac-tx);text-decoration:none;padding:8px 14px;border-radius:8px}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
form .full{grid-column:1/-1}
form h2{margin:0;font-size:16px;grid-column:1/-1}
.empty{text-align:center;color:var(--mut);padding:32px 0}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;color:var(--c);border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.s0{--c:var(--s0)}.s1{--c:var(--s1)}.s2{--c:var(--s2)}.s3{--c:var(--s3)}.s4{--c:var(--s4)}
.card.s0,.card.s1,.card.s2,.card.s3,.card.s4{border-left-color:var(--c)}
.apps{margin-top:12px;border-top:1px solid var(--bd);padding-top:8px}
.ap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bd)}
.ap .who{flex:1 1 180px}
.ap select{color:var(--c);border-color:var(--c)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.add input{flex:1 1 130px}
.legend{font-size:13px;color:var(--mut);margin-bottom:12px}
.off{opacity:.6}
.row a.desc{color:var(--ac);padding:8px 14px;border:1px solid var(--bd);border-radius:8px;text-decoration:none}
.det{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0 12px}
.det label{display:flex;flex-direction:column;gap:2px}
.det label:has(input[type=checkbox]){flex-direction:row;align-items:center;gap:6px}
.del.conf{background:var(--dn);color:#fff;border-color:var(--dn)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90%;display:none;z-index:9}
@media (max-width:520px){form{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><script id="data" type="application/json">[{"id":1790879900160,"date":"2026-10-01","title":"Team Member","company":"Togos","location":"380 North Capitol ","field":"Food","pay":"19.25","type":"Full-time","url":"https://togos.com/careers/application/","status":"Open","deadline":"2026-10-16","note":"Apply to the one 380 North Capitol - San Jose","descUrl":""},{"id":1790889764247,"date":"2026-10-01","title":"Customer Service Rep","company":"Better Business Beareau ","location":"","field":"Customer Service ","pay":"","type":"Full-time","url":"info@lasvbbb.org","status":"Open","deadline":"2026-10-17","descUrl":"","note":"Submit Resume to info@lasvbbb.org - Please include in the email that you were referred by San Jose Works "},{"id":1790889949151,"date":"2026-10-01","title":"Cashier - ","company":"Vallarta Supermarket","location":"","field":"Customer Service ","pay":"","type":"Full-time","url":"","status":"Open","deadline":"2026-10-17","descUrl":"","note":"Hiring for multiple positions \n\nCashiers (approximately 30 openings) - \n-Grocery Retail Management\n-Bakers\n-Meat Cutters\n-Loss Prevention\n-Human Resources Representative\n-Maintenance Repair Technician\n-Management"}]</script><script id="cfg" type="application/json">{"title":"Apply here","text":"","url":""}</script><script id="app">
const TYPES=["Full-time","Part-time","Contract","Internship"];
const ST=["Applied","Interviewing","Offer","Hired","Not selected"];
let jobs=JSON.parse(document.getElementById("data").textContent);
const css=document.getElementById("css").textContent;
const appSrc=document.getElementById("app").textContent;
let canEdit=false,art=null,db=null,apps=[],q="",ft="All",ff="All",af="All",editId=null,openId=null,busy=false,dirty=false,pend="",info={},openApp=null,showClosed=false,dl=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const today=()=>new Date().toISOString().slice(0,10);
const isOpen=j=>(j.status||"Open")==="Open"&&!(j.deadline&&j.deadline<today());
let tt;function note(t){const el=$("#toast");el.textContent=t;el.style.display="block";clearTimeout(tt);tt=setTimeout(()=>el.style.display="none",6000)}
window.alert=note;

$("#root").innerHTML='<main><h1>Job Board</h1><p class="sub" id="count"></p><div id="stats"></div><div id="sec"></div><div id="formWrap"></div><div class="bar"><input id="q" placeholder="Search jobs, companies, places"><select id="ft"><option>All</option>'+TYPES.map(t=>"<option>"+t+"</option>").join("")+'</select><select id="ff"></select><select id="af" style="display:none"><option value="All">All jobs</option><option value="has">Has applicants</option><option value="none">No applicants yet</option></select><label class="meta" style="align-self:center"><input type="checkbox" id="sc"> Show closed</label></div><div id="imp" style="display:none;margin-bottom:16px"><button id="impBtn">Import applicants (CSV)</button> <button id="expBtn">Export applicants (CSV)</button> <input id="csv" type="file" accept=".csv,text/csv" hidden> <span class="meta">Needs a job column and a name column; email, phone, notes, status and date are optional.</span><div id="impMsg" class="meta" style="margin-top:8px"></div></div><div id="list"></div></main><div id="toast"></div>';
$("#q").oninput=e=>{q=e.target.value.toLowerCase();renderList()};
$("#ft").onchange=e=>{ft=e.target.value;renderList()};
$("#ff").onchange=e=>{ff=e.target.value;renderList()};
$("#sc").onchange=e=>{showClosed=e.target.checked;renderList()};
$("#af").onchange=e=>{af=e.target.value;renderList()};

function best(list){
  if(!list.length)return"";
  for(const i of [3,2,1,0]) if(list.some(a=>a.status===ST[i]))return"s"+i;
  return"s4";
}
let cfg={title:"Apply here",text:"",url:""};
try{cfg={...cfg,...JSON.parse(document.getElementById("cfg").textContent)}}catch(e){}
function renderSec(){
  const u=safeUrl(cfg.url);
  $("#sec").innerHTML=(canEdit?'<div class="bar"><input id="sU" placeholder="Application form link (Google Forms or Microsoft Forms)" value="'+esc(cfg.url)+'"><button class="pri" id="sS">Save link</button></div>':"")+(u?'<div class="card s0"><h2 style="margin:0 0 4px;font-size:20px">'+esc(cfg.title||"Apply here")+'</h2>'+(cfg.text?'<p style="margin:0 0 4px">'+esc(cfg.text)+'</p>':"")+'<div class="row"><a class="apply" href="'+esc(u)+'" target="_blank" rel="noopener">Open application form</a></div></div>':"");
  if(canEdit)$("#sS").onclick=()=>{
    const v=$("#sU").value.trim();
    if(v&&!safeUrl(v)){note("The link needs to start with https://");return}
    cfg={...cfg,url:v};save();
  };
}
function renderStats(){
  if(!canEdit){$("#stats").innerHTML="";return}
  $("#stats").innerHTML='<div class="legend">Staff view: card color shows the furthest stage any applicant has reached. Grey = no applicants yet.</div><div class="stats"><span class="pill" style="--c:var(--tx)">'+apps.length+' applicants</span>'+ST.map((s,i)=>'<span class="pill s'+i+'">'+apps.filter(a=>a.status===s).length+" "+s+"</span>").join("")+"</div>";
}
function detail(a){
  const inp=(f,l,t)=>'<label class="meta">'+l+'<input type="'+(t||"text")+'" data-f="'+f+'" data-a="'+esc(a.id)+'" value="'+esc(a[f])+'"></label>';
  const chk=(f,l)=>'<label class="meta"><input type="checkbox" data-f="'+f+'" data-a="'+esc(a.id)+'"'+(a[f]?" checked":"")+'> '+l+'</label>';
  return '<div class="det">'+inp("caseworker","Case worker")+inp("followUp","Follow-up date","date")+'<span style="grid-column:1/-1;display:contents">'+inp("notes","Private notes")+'</span>'+(a.status==="Hired"?inp("startDate","Start date","date")+inp("wage","Starting wage")+chk("c30","30-day check-in done")+chk("c90","90-day check-in done"):"")+'</div>';
}
function appsHtml(j,list){
  return '<div class="apps"><div class="det"><label class="meta" style="grid-column:1/-1">Employer contact (staff only)<input data-ji="'+j.id+'" placeholder="Name, phone, email" value="'+esc((info[j.id]||{}).contact)+'"></label></div>'+(list.length?list.map(a=>{
    const i=Math.max(0,ST.indexOf(a.status)),due=a.followUp&&a.followUp<=today()&&i<3;
    return '<div class="ap"><div class="who"><b>'+esc(a.name)+'</b>'+(due?' <span class="pill s1">Follow up</span>':"")+'<div class="meta">'+esc(a.contact)+(a.caseworker?" · "+esc(a.caseworker):"")+" · "+esc(a.date)+'</div></div><select data-st="'+esc(a.id)+'">'+ST.map(s=>"<option"+(s===a.status?" selected":"")+">"+s+"</option>").join("")+'</select><button data-oa="'+esc(a.id)+'">'+(openApp===a.id?"Close":"Details")+'</button><button class="del'+(pend==="x"+a.id?" conf":"")+'" data-xa="'+esc(a.id)+'">'+(pend==="x"+a.id?"Confirm?":"Remove")+'</button></div>'+(openApp===a.id?detail(a):"");
  }).join(""):'<div class="meta">No applicants yet.</div>')+
  '<div class="add"><input class="an" placeholder="Applicant name"><input class="ac" placeholder="Phone or email"><input class="anote" placeholder="Notes (optional)"><button class="pri" data-ad="'+j.id+'">Add applicant</button></div></div>';
}
function renderList(){
  const fields=[...new Set(jobs.map(j=>(j.field||"").trim()).filter(Boolean))].sort();
  if(ff!=="All"&&!fields.includes(ff))ff="All";
  $("#ff").innerHTML='<option value="All">All fields</option>'+fields.map(f=>"<option"+(f===ff?" selected":"")+">"+esc(f)+"</option>").join("");
  $("#ff").style.display=fields.length?"":"none";
  $("#af").style.display=canEdit?"":"none";
  $("#imp").style.display=canEdit&&db?"":"none";
  $("#expBtn").style.display=dl?"":"none";
  $("#stats").innerHTML="";
  const rows=jobs.filter(j=>{
    const mine=apps.filter(a=>a.jobId===j.id);
    const text=(j.title+" "+j.company+" "+j.location+" "+(j.field||"")+" "+(j.pay||"")+" "+(j.note||"")+(canEdit?" "+mine.map(a=>a.name).join(" "):"")).toLowerCase();
    return (ft==="All"||j.type===ft)&&(ff==="All"||(j.field||"").trim()===ff)&&(showClosed||isOpen(j))&&text.includes(q)&&(af==="All"||(af==="has"?mine.length:!mine.length));
  }).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const no=jobs.filter(isOpen).length;$("#count").textContent=no+" open "+(no===1?"role":"roles");
  $("#list").innerHTML=rows.length?rows.map(j=>{
    const u=safeUrl(j.url)||safeUrl(cfg.url),mine=apps.filter(a=>a.jobId===j.id);
    return '<div class="card '+(isOpen(j)?"":" off")+'"><h3>'+esc(j.title)+'<span class="tag">'+esc(j.type)+'</span>'+(j.field?'<span class="tag">'+esc(j.field)+'</span>':"")+(isOpen(j)?"":'<span class="tag">'+esc(j.status&&j.status!=="Open"?j.status:"Closed")+'</span>')+'</h3><div class="meta">'+esc(j.company)+" · "+esc(j.location)+(j.pay?" · "+esc(j.pay):"")+(j.deadline&&isOpen(j)?" · apply by "+esc(j.deadline):"")+" · posted "+esc(j.date)+'</div>'+(j.note?'<p>'+esc(j.note)+'</p>':"")+
    '<div class="row">'+(u&&isOpen(j)?'<a class="apply" href="'+esc(u)+'" target="_blank" rel="noopener">Apply now</a>':"")+(safeUrl(j.descUrl)?'<a class="desc" href="'+esc(safeUrl(j.descUrl))+'" target="_blank" rel="noopener">Job description</a>':"")+
    (canEdit?'<button data-o="'+j.id+'">'+(openId===j.id?"Hide":"Applicants ("+mine.length+")")+'</button><button data-e="'+j.id+'">Edit</button><button class="del'+(pend==="d"+j.id?" conf":"")+'" data-d="'+j.id+'">'+(pend==="d"+j.id?"Click again to confirm":"Delete")+'</button>':"")+'</div>'+
    (canEdit&&openId===j.id?appsHtml(j,mine):"")+'</div>';
  }).join(""):'<div class="empty">No jobs match.</div>';
}
function softRender(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest("#list")&&/INPUT|TEXTAREA/.test(a.tagName))dirty=true;else renderList();
}
$("#list").addEventListener("focusout",()=>{if(dirty){dirty=false;setTimeout(renderList,0)}});
$("#list").onclick=async e=>{
  const b=e.target.closest("button");
  const was=pend;pend="";
  if(!b){if(was)renderList();return}
  const d=b.dataset;
  const key=d.d?"d"+d.d:d.xa?"x"+d.xa:"";
  if(key&&was!==key){pend=key;renderList();return}
  try{
    if(d.o){openId=openId===+d.o?null:+d.o;renderList()}
    else if(d.oa){openApp=openApp===d.oa?null:d.oa;renderList()}
    else if(d.e){editId=+d.e;renderForm();scrollTo(0,0)}
    else if(d.d){
      const id=+d.d;
      if(db)await Promise.all(apps.filter(a=>a.jobId===id).map(a=>db.doc("applicants/"+a.id).delete()).concat([db.doc("jobinfo/"+id).delete().catch(()=>{})]));
      jobs=jobs.filter(j=>j.id!==id);save();
    }
    else if(d.ad&&db){
      const c=b.closest(".apps"),name=c.querySelector(".an").value.trim();
      if(!name)return;
      await db.collection("applicants").add({jobId:+d.ad,name,contact:c.querySelector(".ac").value.trim(),notes:c.querySelector(".anote").value.trim(),status:"Applied",date:new Date().toISOString().slice(0,10)});
    }
    else if(d.xa&&db){await db.doc("applicants/"+d.xa).delete()}
  }catch(err){alert("Couldn't save: "+(err&&err.code||"error"))}
};
$("#list").onchange=async e=>{
  if(!db)return;const t=e.target;
  try{
    if(t.dataset.st)await db.doc("applicants/"+t.dataset.st).update({status:t.value});
    else if(t.dataset.f)await db.doc("applicants/"+t.dataset.a).update({[t.dataset.f]:t.type==="checkbox"?t.checked:t.value});
    else if(t.dataset.ji)await db.doc("jobinfo/"+t.dataset.ji).set({contact:t.value});
  }catch(err){note("Couldn't save: "+(err&&err.code||"error"))}
};

$("#expBtn").onclick=async()=>{
  if(!dl){note("Export isn't available here.");return}
  const cell=v=>{v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const head=["Job","Company","Name","Contact","Status","Date applied","Case worker","Follow-up date","Notes","Start date","Starting wage","30-day check-in","90-day check-in"];
  const rows=apps.map(a=>{const j=jobs.find(x=>x.id===a.jobId)||{};return [j.title,j.company,a.name,a.contact,a.status,a.date,a.caseworker,a.followUp,a.notes,a.startDate,a.wage,a.c30?"Yes":"",a.c90?"Yes":""]});
  try{await dl.save({filename:"applicants.csv",data:"\ufeff"+[head,...rows].map(r=>r.map(cell).join(",")).join("\r\n")});note("Exported "+rows.length+" applicants.")}
  catch(err){if(!err||err.code!=="declined")note("Export failed: "+(err&&err.code||"error"))}
};
function parseCSV(t){
  const r=[];let row=[],f="",inq=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(inq){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else inq=false}else f+=c}
    else if(c=='"')inq=true;
    else if(c==","){row.push(f);f=""}
    else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);r.push(row);row=[];f=""}
    else f+=c;
  }
  if(f||row.length){row.push(f);r.push(row)}
  return r.filter(x=>x.some(v=>v.trim()));
}
$("#impBtn").onclick=()=>$("#csv").click();
$("#csv").onchange=async e=>{
  const file=e.target.files[0];e.target.value="";
  if(!file||!db)return;
  try{
    const rows=parseCSV((await file.text()).replace(/^\ufeff/,""));
    if(rows.length<2){alert("No rows found in that file.");return}
    const h=rows[0].map(x=>x.trim().toLowerCase());
    const idx=re=>h.findIndex(x=>re.test(x));
    const iJ=idx(/job|position|role/),iN=idx(/^(full )?name$/),iF=idx(/first/),iL=idx(/last|surname/),iNo=idx(/note|comment/),iS=idx(/status/),iD=idx(/date|time/);
    const iC=h.map((x,i)=>/email|phone|contact/.test(x)?i:-1).filter(i=>i>=0);
    if(iJ<0||(iN<0&&iF<0)){alert("I need a column for the job (named job, position or role) and one for the name.");return}
    const today=new Date().toISOString().slice(0,10);
    const seen=new Set(apps.map(a=>a.jobId+"|"+String(a.name).toLowerCase()+"|"+(a.contact||"")));
    const add=[],miss=new Set();let dup=0;
    for(const r of rows.slice(1)){
      const v=(r[iJ]||"").trim().toLowerCase();
      const job=jobs.find(j=>j.title.trim().toLowerCase()===v)||jobs.find(j=>v&&v.includes(j.title.trim().toLowerCase()));
      const name=(iN>=0?r[iN]:((r[iF]||"")+" "+(iL>=0?r[iL]||"":""))).trim();
      if(!name)continue;
      if(!job){miss.add(r[iJ]||"(blank)");continue}
      const contact=iC.map(i=>(r[i]||"").trim()).filter(Boolean).join(" / ");
      const key=job.id+"|"+name.toLowerCase()+"|"+contact;
      if(seen.has(key)){dup++;continue}
      seen.add(key);
      const st=ST.find(s=>s.toLowerCase()===(iS>=0?(r[iS]||"").trim().toLowerCase():""))||"Applied";
      let date=today;
      if(iD>=0&&r[iD]){const d=new Date(r[iD]);if(!isNaN(d))date=d.toISOString().slice(0,10)}
      add.push({jobId:job.id,name,contact,notes:iNo>=0?(r[iNo]||"").trim():"",status:st,date});
    }
    const m=[...miss];
    if(!add.length){alert("Nothing new to import."+(dup?" "+dup+" were already on the board.":"")+(m.length?" No job matched: "+m.slice(0,5).join(", "):""));return}
    const msg="Import "+add.length+" applicant"+(add.length===1?"":"s")+"?"+(dup?" "+dup+" duplicates will be skipped.":"")+(m.length?" No matching job for: "+m.slice(0,5).join(", ")+(m.length>5?"...":"")+".":"");
    $("#impMsg").innerHTML=esc(msg)+' <button class="pri" id="impGo">Confirm import</button> <button id="impNo">Cancel</button>';
    $("#impNo").onclick=()=>{$("#impMsg").innerHTML=""};
    $("#impGo").onclick=async()=>{
      $("#impMsg").textContent="Importing...";
      try{for(const a of add)await db.collection("applicants").add(a);$("#impMsg").textContent="";note("Imported "+add.length+".")}
      catch(err){$("#impMsg").textContent="";note("Import stopped: "+(err&&err.code||"error"))}
    };
  }catch(err){alert("Import stopped: "+(err&&err.code||err&&err.message||"error"))}
};

function renderForm(){
  if(!canEdit){$("#formWrap").innerHTML="";return}
  const j=jobs.find(x=>x.id===editId)||{};
  $("#formWrap").innerHTML='<form id="f"><h2>'+(editId?"Edit job":"Add a job")+'</h2><input class="full" name="title" placeholder="Job title" required value="'+esc(j.title)+'"><input name="company" placeholder="Company" required value="'+esc(j.company)+'"><input name="location" placeholder="Location" value="'+esc(j.location)+'"><input name="field" placeholder="Field / industry (e.g. Healthcare, Retail)" value="'+esc(j.field)+'"><input name="pay" placeholder="Pay rate (e.g. $20/hr or $55,000/yr)" value="'+esc(j.pay)+'"><select name="type">'+TYPES.map(t=>"<option"+(t===j.type?" selected":"")+">"+t+"</option>").join("")+'</select><input name="url" placeholder="Microsoft Forms link for this job (https://forms.office.com/...)" value="'+esc(j.url)+'"><select name="status">'+["Open","Filled","Closed"].map(t=>"<option"+(t===(j.status||"Open")?" selected":"")+">"+t+"</option>").join("")+'</select><label class="meta" style="display:flex;gap:6px;align-items:center">Apply by<input type="date" name="deadline" value="'+esc(j.deadline)+'"></label><input class="full" name="descUrl" placeholder="Link to the full job description (https://...)" value="'+esc(j.descUrl)+'"><textarea class="full" name="note" rows="2" placeholder="Short description">'+esc(j.note)+'</textarea><div class="full row"><button class="pri" type="submit">'+(editId?"Save changes":"Add job")+'</button>'+(editId?'<button type="button" id="cx">Cancel</button>':"")+'</div></form>';
  $("#f").onsubmit=e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(e.target));
    if(editId){jobs=jobs.map(x=>x.id===editId?{...x,...d}:x)}
    else{jobs.push({id:Date.now(),date:new Date().toISOString().slice(0,10),...d})}
    editId=null;save();
  };
  if(editId)$("#cx").onclick=()=>{editId=null;renderForm()};
}

async function save(){
  if(!art){note("Can't save here. Open the board signed in to Claude as an owner or editor.");return}
  if(busy)return;
  busy=true;
  const data=JSON.stringify(jobs).replace(/</g,"\\u003c");
  const doc='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Job Board</title><style id="css">'+css+'</style></head><body><div id="root"></div><script id="data" type="application/json">'+data+'<\/script><script id="cfg" type="application/json">'+JSON.stringify(cfg).replace(/</g,"\\u003c")+'<\/script><script id="app">'+appSrc+'<\/script></body></html>';
  try{await art.publish(doc)}catch(err){busy=false;alert("Couldn't save: "+(err&&err.code||"error"))}
}

renderSec();renderList();
(async()=>{
  if(!window.claude||!claude.use)return;
  try{
    const user=await claude.use("user");
    art=await claude.use("artifact");
    canEdit=!!(art&&user&&(user.isOwner()||user.canEdit()));
    renderForm();renderSec();renderList();
    if(canEdit){
      db=await claude.use("db");
      if(db){
        db.collection("applicants").onSnapshot(s=>{apps=s.docs.map(d=>({...d.data(),id:d.id}));softRender()},()=>{});
        db.collection("jobinfo").onSnapshot(s=>{info={};s.docs.forEach(d=>{info[d.id]=d.data()});softRender()},()=>{});
      }
      dl=await claude.use("downloads");renderList();
    }
  }catch(e){}
})();
</script></body></html>
