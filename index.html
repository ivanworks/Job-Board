<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Job Board</title><style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e4e4df;--ac:#2f6fed;--ac-tx:#fff;--dn:#c0392b;--s0:#2f6fed;--s1:#d98a00;--s2:#8a4fd6;--s3:#1f9d55;--s4:#8a8a85;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222221;--tx:#efefec;--mut:#9a9a94;--bd:#33332f;--ac:#6c9bff;--ac-tx:#111;--dn:#ff7b6b;--s0:#6c9bff;--s1:#f0b040;--s2:#b58cf0;--s3:#4cc47f;--s4:#a0a09a}}:root[data-theme="dark"]{--bg:#171716;--card:#222221;--tx:#efefec;--mut:#9a9a94;--bd:#33332f;--ac:#6c9bff;--ac-tx:#111;--dn:#ff7b6b;--s0:#6c9bff;--s1:#f0b040;--s2:#b58cf0;--s3:#4cc47f;--s4:#a0a09a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:760px;margin:0 auto;padding:24px 16px 48px}h1{margin:0 0 4px;font-size:28px}.sub{color:var(--mut);margin:0 0 16px}.bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;min-width:0}.bar input{flex:1 1 200px}button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px}.card{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}.card h3{margin:0 0 2px;font-size:18px}.meta{color:var(--mut);font-size:14px}.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin-left:6px}.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}.row a.apply{background:var(--ac);color:var(--ac-tx);text-decoration:none;padding:8px 14px;border-radius:8px}.empty{text-align:center;color:var(--mut);padding:32px 0}.off{opacity:.6}.row a.desc{color:var(--ac);padding:8px 14px;border:1px solid var(--bd);border-radius:8px;text-decoration:none}
.row a.desc{color:var(--ac);padding:8px 14px;border:1px solid var(--bd);border-radius:8px;text-decoration:none}
</style></head><body><div id="root"></div>
<script id="data" type="application/json">[{"id":1790879900160,"date":"2026-10-01","title":"Togos","company":"Togos","location":"1608 las plumas","field":"Food","pay":"19.25","type":"Full-time","url":"https://togos.com/careers/application/","status":"Open","deadline":"2026-10-02","note":"looking for cashier"}]</script>
<script id="cfg" type="application/json">{"title":"Apply here","text":"","url":""}</script>
<script>
const jobs=JSON.parse(document.getElementById("data").textContent);
const cfg=JSON.parse(document.getElementById("cfg").textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const today=()=>new Date().toISOString().slice(0,10);
const isOpen=j=>(j.status||"Open")==="Open"&&!(j.deadline&&j.deadline<today());
let q="",ft="All",ff="All",sc=false;
const types=[...new Set(jobs.map(j=>j.type).filter(Boolean))];
const fields=[...new Set(jobs.map(j=>(j.field||"").trim()).filter(Boolean))].sort();
const fu=safeUrl(cfg.url);
$("#root").innerHTML='<main><h1>Job Board</h1><p class="sub" id="count"></p>'+
(fu?'<div class="card"><h3>'+esc(cfg.title||"Apply here")+'</h3>'+(cfg.text?'<p>'+esc(cfg.text)+'</p>':"")+'<div class="row"><a class="apply" href="'+esc(fu)+'" target="_blank" rel="noopener">Open application form</a></div></div>':"")+
'<div class="bar"><input id="q" placeholder="Search jobs, companies, places"><select id="ft"><option>All</option>'+types.map(t=>"<option>"+esc(t)+"</option>").join("")+'</select>'+(fields.length?'<select id="ff"><option value="All">All fields</option>'+fields.map(f=>"<option>"+esc(f)+"</option>").join("")+'</select>':"")+'<label class="meta" style="align-self:center"><input type="checkbox" id="sc"> Show closed</label></div><div id="list"></div></main>';
$("#q").oninput=e=>{q=e.target.value.toLowerCase();render()};
$("#ft").onchange=e=>{ft=e.target.value;render()};
if($("#ff"))$("#ff").onchange=e=>{ff=e.target.value;render()};
$("#sc").onchange=e=>{sc=e.target.checked;render()};
function render(){
  const n=jobs.filter(isOpen).length;
  $("#count").textContent=n+" open "+(n===1?"role":"roles");
  const rows=jobs.filter(j=>(ft==="All"||j.type===ft)&&(ff==="All"||(j.field||"").trim()===ff)&&(sc||isOpen(j))&&(j.title+" "+j.company+" "+j.location+" "+(j.field||"")+" "+(j.pay||"")+" "+(j.note||"")).toLowerCase().includes(q))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  $("#list").innerHTML=rows.length?rows.map(j=>{
    const u=safeUrl(j.url)||fu,d=safeUrl(j.descUrl);
    return '<div class="card'+(isOpen(j)?"":" off")+'"><h3>'+esc(j.title)+'<span class="tag">'+esc(j.type)+'</span>'+(j.field?'<span class="tag">'+esc(j.field)+'</span>':"")+(isOpen(j)?"":'<span class="tag">'+esc(j.status&&j.status!=="Open"?j.status:"Closed")+'</span>')+'</h3><div class="meta">'+esc(j.company)+" · "+esc(j.location)+(j.pay?" · "+esc(j.pay):"")+(j.deadline&&isOpen(j)?" · apply by "+esc(j.deadline):"")+" · posted "+esc(j.date)+'</div>'+(j.note?'<p>'+esc(j.note)+'</p>':"")+
    '<div class="row">'+(u&&isOpen(j)?'<a class="apply" href="'+esc(u)+'" target="_blank" rel="noopener">Apply now</a>':"")+(d?'<a class="desc" href="'+esc(d)+'" target="_blank" rel="noopener">Job description</a>':"")+'</div></div>';
  }).join(""):'<div class="empty">No jobs match.</div>';
}
render();
</script></body></html>
